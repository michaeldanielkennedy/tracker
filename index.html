<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tracker</title>
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tracker">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
  :root {
    --bg:#f5f6f8; --card:#fff; --text:#1c1e21; --muted:#6b7280; --line:#e3e5e9;
    --accent:#2563eb; --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111317; --card:#1b1e24; --text:#eceef1; --muted:#9aa1ac; --line:#2c313a; --accent:#5b8cff; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:10px 12px; padding-top:max(10px, env(safe-area-inset-top)); padding-bottom:max(10px, env(safe-area-inset-bottom)); }
  h1 { font-size:1.1rem; margin:0; }
  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  nav { display:flex; gap:5px; margin-bottom:8px; }
  nav button { flex:1; padding:7px 4px; border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:8px; font-size:.85rem; cursor:pointer; }
  nav button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:9px 11px; margin-bottom:7px; }
  .card h2 { margin:0; font-size:.98rem; }
  .sub { color:var(--muted); font-size:.75rem; }
  .row { display:flex; align-items:center; gap:10px; }
  .grow { flex:1; }
  .weight { display:flex; align-items:center; gap:3px; margin-top:4px; }
  .weight input { width:52px; font-size:1rem; padding:3px 2px; text-align:center; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); }
  .weight .step { width:28px; height:28px; padding:0; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--text); font-size:1.1rem; cursor:pointer; }
  .tag { font-size:.75rem; padding:2px 8px; border-radius:99px; background:var(--bg); border:1px solid var(--line); color:var(--muted); }
  .tag.up { color:var(--ok); border-color:var(--ok); }
  .lift { display:flex; align-items:center; gap:8px; }
  .info { flex:1; min-width:0; }
  .sets { display:flex; gap:4px; }
  .set { width:32px; height:32px; padding:0; flex:none; border-radius:50%; border:2px solid var(--line); background:var(--bg); color:var(--muted); font-size:1rem; font-weight:600; cursor:pointer; user-select:none; }
  .set.done { background:var(--ok); border-color:var(--ok); color:#fff; }
  .set.part { background:var(--warn); border-color:var(--warn); color:#fff; }
  .set.miss { background:var(--bad); border-color:var(--bad); color:#fff; }
  .primary { width:100%; padding:11px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-size:1rem; font-weight:600; cursor:pointer; }
  .ghost { padding:8px 12px; border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:8px; cursor:pointer; font-size:.85rem; }
  .danger { color:var(--bad); }
  table { width:100%; border-collapse:collapse; font-size:.9rem; }
  td,th { text-align:left; padding:5px 4px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:500; font-size:.8rem; }
  select { padding:8px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:1rem; }
  .setup label { display:flex; justify-content:space-between; align-items:center; padding:6px 0; }
  .setup input { width:100px; padding:6px 8px; font-size:1rem; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); }
  svg { width:100%; height:auto; display:block; }
  .cal { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; margin-top:8px; text-align:center; }
  .cal b { font-size:.7rem; color:var(--muted); font-weight:500; }
  .day { height:30px; border:0; border-radius:8px; background:transparent; color:var(--muted); font-size:.8rem; padding:0; }
  .day.today { box-shadow:inset 0 0 0 1.5px var(--accent); }
  .day.tw { color:#fff; font-weight:700; cursor:pointer; }
  .legend { display:flex; flex-wrap:wrap; gap:4px 10px; margin-top:8px; font-size:.7rem; color:var(--muted); }
  .legend i { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:4px; vertical-align:middle; }
  .seg { display:flex; gap:4px; margin-bottom:7px; }
  .seg button { flex:1; padding:6px 0; border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:8px; font-size:.8rem; cursor:pointer; }
  .seg button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .xrow { display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid var(--line); }
  .setup .chk, .setup .xnums label { padding:0; justify-content:flex-start; }
  .chk { display:flex; align-items:center; gap:3px; font-size:.8rem; }
  .chk input { width:auto; margin:0; }
  .xadd { padding-top:8px; }
  .xadd > input { width:100%; padding:7px 9px; font-size:.95rem; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); }
  .xnums { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin:6px 0; }
  .xnums label { display:block; font-size:.7rem; color:var(--muted); }
  .xnums input { width:100%; padding:6px; font-size:.9rem; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); }
  .vd { margin-bottom:8px; }
  .vd textarea { width:100%; padding:7px 9px; font:inherit; font-size:.9rem; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); resize:vertical; }
  .lift.wide { flex-wrap:wrap; }
  .lift.wide .sets { flex:0 0 100%; display:grid; grid-template-columns:repeat(5,1fr); gap:5px; margin-top:6px; }
  .lift.wide .set { width:100%; border-radius:10px; }
  .hint { color:var(--muted); font-size:.72rem; margin:2px 0 8px; }
  .empty { color:var(--muted); text-align:center; padding:24px 0; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Tracker</h1>
    <span class="sub" id="today"></span>
  </header>
  <nav>
    <button data-tab="workout" class="on">Workout</button>
    <button data-tab="history">History</button>
    <button data-tab="progress">Progress</button>
    <button data-tab="settings">Settings</button>
  </nav>
  <div id="view"></div>
</main>

<script>
(() => {
  'use strict';

  const INCREMENTS = { 'Deadlift':5 };   // kg added each workout (default below)
  const DEFAULT_INC = 2.5;
  const extraOf = name => (state.extras || []).find(e => e.name === name);
  const inc = lift => { const e = pid() === 'strength' && extraOf(lift); return e ? e.inc : (INCREMENTS[lift] || DEFAULT_INC); };
  const SETS = 5, REPS = 5;
  const WORKOUTS = {
    A: ['Squat', 'Bench Press', 'Barbell Row'],
    B: ['Squat', 'Overhead Press', 'Deadlift'],
  };
  const ALL_LIFTS = ['Squat', 'Bench Press', 'Barbell Row', 'Overhead Press', 'Deadlift'];
  const DEFAULT_START = { 'Squat':20, 'Bench Press':20, 'Barbell Row':30, 'Overhead Press':20, 'Deadlift':40 };
  const KEY = 'fivebyfive.v1';

  // Programs. 'strength' is the A/B 5x5; the two volume programs share one editable plan
  // but keep separate history/weights (10x10 and 5x20 use different loads).
  const PROGRAMS = {
    strength: { name:'Strength 5×5',  order:['A','B'] },
    vol10:    { name:'Volume 10×10',  order:['A','B','C'], sets:10, reps:10, startFactor:0.6 },
    vol20:    { name:'Volume 5×20',   order:['A','B','C'], sets:5,  reps:20, startFactor:0.5 },
  };
  // One exercise per line. Plain name = the program's sets x reps. "3x12" overrides; trailing "bw" = bodyweight.
  const DEFAULT_VOLUME_DAYS = {
    A: ['Bench Press', 'Barbell Row', 'Incline Dumbbell Press 3x12', 'Lat Pulldown 3x12'],
    B: ['Squat', 'Leg Curl', 'Calf Raise 3x15', 'Hanging Knee Raise 3x15 bw'],
    C: ['Overhead Press', 'Barbell Curl', 'Triceps Pushdown 3x12', 'Lateral Raise 3x15'],
  };

  // ---------- state ----------
  // { started:bool, start:{lift:kg}, history:[{id,date,type,lifts:[{name,weight,reps:[5,5,5,5,5]}]}], draft:{type,lifts:[...]}|null }
  let state = load();
  let tab = 'workout';

  function normalize(s) {
    s.extras = s.extras || [];
    s.program = PROGRAMS[s.program] ? s.program : 'strength';
    s.volumeDays = s.volumeDays || JSON.parse(JSON.stringify(DEFAULT_VOLUME_DAYS));
    return s;
  }
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(KEY));
      if (s && s.history) return normalize(s);
    } catch (e) {}
    return normalize({ started:false, start:{...DEFAULT_START}, history:[], draft:null });
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { alert('Could not save: ' + e.message); }
  }

  // ---------- logic ----------
  const pid = () => (state && PROGRAMS[state.program]) ? state.program : 'strength';
  const prog = () => PROGRAMS[pid()];
  const hist = () => state.history.filter(w => (w.program || 'strength') === pid());

  function nextType() {
    const order = prog().order;
    const last = hist()[hist().length - 1];
    if (!last || !order.includes(last.type)) return order[0];
    return order[(order.indexOf(last.type) + 1) % order.length];
  }
  // Most recent record of a lift within the current program, or null.
  function lastLift(lift) {
    const h = hist();
    for (let i = h.length - 1; i >= 0; i--) {
      const l = h[i].lifts.find(x => x.name === lift);
      if (l) return l;
    }
    return null;
  }
  const lastWeight = lift => { const l = lastLift(lift); return l ? l.weight : null; };

  // First-ever weight for a lift in the current program.
  function startWeight(lift, bw) {
    if (bw) return 0;
    if (pid() === 'strength') {
      const e = extraOf(lift);
      return e ? e.start : Number(state.start[lift]) || 0;
    }
    // Volume: derive from your latest strength weight (or starting weight) if it's a known lift, else 20 kg.
    let base = null;
    for (let i = state.history.length - 1; i >= 0 && base === null; i--) {
      const w = state.history[i];
      if ((w.program || 'strength') !== 'strength') continue;
      const l = w.lifts.find(x => x.name === lift);
      if (l) base = l.weight;
    }
    if (base === null && state.start[lift]) base = Number(state.start[lift]);
    return base === null ? 20 : Math.max(2.5, Math.round(base * prog().startFactor / 2.5) * 2.5);
  }
  // Strength: always last + increment. Volume: only go up if every set hit the target reps, else repeat.
  function targetWeight(lift, bw) {
    const l = lastLift(lift);
    if (!l) return startWeight(lift, bw);
    if (pid() !== 'strength') {
      const t = l.target || prog().reps;
      if (!(l.reps.length && l.reps.every(r => r >= t))) return l.weight;
    }
    return l.weight + inc(lift);
  }

  // "Incline Press 3x12", "Pull-ups 3x10 bw", "Squat" -> lift spec
  function parseLine(line) {
    let name = line.trim();
    if (!name) return null;
    let bw = false, sets = prog().sets, reps = prog().reps;
    const b = name.match(/\s+bw$/i);
    if (b) { bw = true; name = name.slice(0, b.index).trim(); }
    const m = name.match(/\s+(\d+)\s*[x×]\s*(\d+)$/i);
    if (m) { sets = Math.min(10, Math.max(1, +m[1])); reps = Math.max(1, +m[2]); name = name.slice(0, m.index).trim(); }
    return name ? { name, sets, target:reps, bw, extra:true } : null;
  }
  function dayLifts(type) {
    if (pid() === 'strength') return [
      ...WORKOUTS[type].map(name => ({ name, sets:SETS, target:REPS, bw:false })),
      ...state.extras.filter(e => e.on[type]).map(e => ({ name:e.name, sets:e.sets, target:e.reps, extra:true, bw:!!e.bw })),
    ];
    return (state.volumeDays[type] || []).map(parseLine).filter(Boolean);
  }
  function buildDraft() {
    const type = nextType();
    return {
      pid: pid(),
      type,
      lifts: dayLifts(type).map(l => ({
        ...l,
        weight: targetWeight(l.name, l.bw),
        prev: lastWeight(l.name),
        reps: Array(l.sets).fill(null),   // null = not attempted yet
      })),
    };
  }
  function ensureDraft() {
    // Rebuild if the draft belongs to another program / workout, or is from an older format.
    const d = state.draft;
    if (!d || (d.pid || 'strength') !== pid() || d.type !== nextType() || d.lifts.some(l => !l.target)) { state.draft = buildDraft(); save(); }
  }

  const fmt = n => (Math.round(n * 100) / 100).toString();
  const el = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstChild; };

  // ---------- views ----------
  const view = document.getElementById('view');
  document.getElementById('today').textContent = new Date().toLocaleDateString(undefined, { weekday:'short', day:'numeric', month:'short' });

  function render() {
    document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
    view.innerHTML = '';
    if (!state.started) return renderSetup();
    ({ workout:renderWorkout, history:renderHistory, progress:renderProgress, settings:renderSettings })[tab]();
  }

  function renderSetup() {
    const rows = ALL_LIFTS.map(l => `<label>${l}<span><input type="number" step="2.5" min="0" data-l="${l}" value="${state.start[l]}"> kg</span></label>`).join('');
    const c = el(`<div class="card setup"><h2>Starting weights</h2>
      <p class="hint">Enter the weight you'll use for your <b>first</b> workout. After that each lift goes up ${DEFAULT_INC} kg (deadlift ${INCREMENTS.Deadlift} kg) every session. Start light (empty bar is 20 kg).</p>
      ${rows}<div style="height:10px"></div><button class="primary" id="go">Start program</button></div>`);
    c.querySelector('#go').onclick = () => {
      c.querySelectorAll('input').forEach(i => { state.start[i.dataset.l] = Number(i.value) || 0; });
      state.started = true; state.draft = null; save(); render();
    };
    view.append(c);
  }

  function renderWorkout() {
    ensureDraft();
    const d = state.draft;
    const last = hist()[hist().length - 1];
    const intro = el(`<div class="card"><div class="row"><div class="grow"><h2>Workout ${d.type} <span class="sub">#${hist().length + 1} · ${prog().name}</span></h2>
      <div class="sub">${last ? `Last: ${last.type} on ${last.date} · ${pid() === 'strength' ? 'weights increased' : 'weight rises when every set hits target'}` : 'First session · starting weights'}</div></div></div></div>`);
    view.append(intro);

    d.lifts.forEach((lift, li) => {
      const up = lift.prev !== null && lift.weight > lift.prev;
      const c = el(`<div class="card lift${lift.sets > 5 ? ' wide' : ''}"><div class="info"><h2>${esc(lift.name)}</h2>
        <div class="sub">${lift.extra ? `${lift.sets}×${lift.target} · ` : ''}${lift.bw ? 'BW + ' : ''}${lift.prev !== null ? `last ${fmt(lift.prev)}${up ? ` (+${fmt(lift.weight - lift.prev)})` : ''}` : 'first time'}</div>
        <div class="weight"><button class="step" data-d="-${inc(lift.name)}">−</button>
          <input type="number" step="0.5" min="0" value="${fmt(lift.weight)}"><span class="sub">${lift.bw ? '+kg' : 'kg'}</span>
          <button class="step" data-d="${inc(lift.name)}">+</button></div></div>
        <div class="sets"></div></div>`);
      const input = c.querySelector('input');
      input.onchange = () => { lift.weight = Math.max(0, Number(input.value) || 0); save(); };
      c.querySelectorAll('.step').forEach(b => b.onclick = () => {
        lift.weight = Math.max(0, lift.weight + Number(b.dataset.d)); input.value = fmt(lift.weight); save();
      });
      const sets = c.querySelector('.sets');
      lift.reps.forEach((r, si) => {
        const b = document.createElement('button');
        const paint = () => {
          const v = lift.reps[si];
          b.textContent = v === null ? '' : v;
          b.className = 'set' + (v === null ? '' : v >= lift.target ? ' done' : v === 0 ? ' miss' : ' part');
        };
        paint();
        // Tap cycle: blank → 5 → 4 → 3 → 2 → 1 → 0 → blank
        b.onclick = () => {
          const v = lift.reps[si];
          lift.reps[si] = v === null ? lift.target : v === 0 ? null : v - 1;
          paint(); save();
        };
        sets.append(b);
      });
      view.append(c);
    });

    view.append(el(`<p class="hint">Tap a set to log the target reps; tap again to lower the count if you missed reps.</p>`));
    const fin = el(`<button class="primary">Finish workout</button>`);
    fin.onclick = () => {
      const anyDone = d.lifts.some(l => l.reps.some(r => r !== null));
      if (!anyDone && !confirm('No sets logged. Finish anyway?')) return;
      state.history.push({
        id: Date.now(),
        date: iso(new Date()),
        type: d.type,
        program: pid(),
        lifts: d.lifts.map(l => ({ name:l.name, weight:l.weight, target:l.target, bw:!!l.bw, reps:l.reps.map(r => r === null ? 0 : r) })),
      });
      state.draft = null; save(); tab = 'history'; render();
    };
    view.append(fin);
  }

  // ---- dates (local, not UTC) ----
  const pad = n => String(n).padStart(2, '0');
  const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parse = s => new Date(s + 'T00:00:00');

  // One colour per program + workout letter, used on the calendar and history cards.
  const WCOLOR = {
    strength: { A:'#2563eb', B:'#16a34a' },
    vol10:    { A:'#d97706', B:'#dc2626', C:'#9333ea' },
    vol20:    { A:'#0891b2', B:'#be185d', C:'#65a30d' },
  };
  const wcolor = w => (WCOLOR[w.program || 'strength'] || WCOLOR.strength)[w.type] || '#6b7280';

  let calY = new Date().getFullYear(), calM = new Date().getMonth();

  function calendar() {
    const byDay = {};
    state.history.forEach(w => { (byDay[w.date] = byDay[w.date] || []).push(w); });
    const first = new Date(calY, calM, 1);
    const lead = (first.getDay() + 6) % 7;                 // Monday-first
    const days = new Date(calY, calM + 1, 0).getDate();
    const todayStr = iso(new Date());
    const monthWorkouts = state.history.filter(w => w.date.startsWith(`${calY}-${pad(calM + 1)}`)).length;
    const seen = new Map();
    state.history.forEach(w => { const k = (w.program || 'strength') + w.type; if (!seen.has(k)) seen.set(k, w); });
    const legend = seen.size ? `<div class="legend">${[...seen.values()].map(w => `<span><i style="background:${wcolor(w)}"></i>${(PROGRAMS[w.program || 'strength'] || PROGRAMS.strength).name} ${w.type}</span>`).join('')}</div>` : '';
    let cells = '';
    for (let i = 0; i < lead; i++) cells += '<span></span>';
    for (let d = 1; d <= days; d++) {
      const ds = `${calY}-${pad(calM + 1)}-${pad(d)}`;
      const w = byDay[ds];
      const cls = 'day' + (ds === todayStr ? ' today' : '') + (w ? ' tw' : '');
      cells += `<button class="${cls}" ${w ? `data-id="${w[0].id}" style="background:${wcolor(w[w.length - 1])}"` : 'disabled'}>${w ? w[w.length - 1].type : d}</button>`;
    }
    const c = el(`<div class="card"><div class="row"><button class="ghost" data-m="-1">‹</button>
      <div class="grow" style="text-align:center"><h2>${first.toLocaleDateString(undefined, { month:'long', year:'numeric' })}</h2>
      <div class="sub">${monthWorkouts} workout${monthWorkouts === 1 ? '' : 's'}</div></div>
      <button class="ghost" data-m="1">›</button></div>
      <div class="cal"><b>M</b><b>T</b><b>W</b><b>T</b><b>F</b><b>S</b><b>S</b>${cells}</div>${legend}</div>`);
    c.querySelectorAll('[data-m]').forEach(b => b.onclick = () => {
      const d = new Date(calY, calM + Number(b.dataset.m), 1); calY = d.getFullYear(); calM = d.getMonth(); render();
    });
    c.querySelectorAll('.day[data-id]').forEach(b => b.onclick = () => {
      const t = document.getElementById('w-' + b.dataset.id); if (t) t.scrollIntoView({ behavior:'smooth', block:'center' });
    });
    return c;
  }

  function renderHistory() {
    view.append(calendar());
    if (!state.history.length) return view.append(el(`<div class="empty">No workouts yet.</div>`));
    [...state.history].reverse().forEach(w => {
      const rows = w.lifts.map(l => `<tr><td>${l.name}</td><td>${l.bw ? (l.weight ? 'BW + ' + fmt(l.weight) + ' kg' : 'BW') : fmt(l.weight) + ' kg'}</td><td>${l.reps.join(' / ')}</td></tr>`).join('');
      const c = el(`<div class="card" id="w-${w.id}" style="border-left:4px solid ${wcolor(w)}"><div class="row"><div class="grow"><h2>Workout ${w.type}</h2><div class="sub">${w.date} · ${PROGRAMS[w.program || 'strength'].name}</div></div>
        <button class="ghost danger">Delete</button></div>
        <table><tr><th>Lift</th><th>Weight</th><th>Reps per set</th></tr>${rows}</table></div>`);
      c.querySelector('button').onclick = () => {
        if (!confirm('Delete this workout? Next weights will be recalculated.')) return;
        state.history = state.history.filter(x => x.id !== w.id); state.draft = null; save(); render();
      };
      view.append(c);
    });
  }

  // ---- progress ----
  const RANGES = { '1W':7, '1M':30, '3M':91, '1Y':365, 'All':null };
  let range = '3M';

  function renderProgress() {
    const bar = el(`<div class="seg">${Object.keys(RANGES).map(r => `<button data-r="${r}" class="${r === range ? 'on' : ''}">${r}</button>`).join('')}</div>`);
    bar.querySelectorAll('button').forEach(b => b.onclick = () => { range = b.dataset.r; render(); });
    view.append(bar);
    view.append(el(`<p class="hint" style="margin-top:0">Showing: ${prog().name}</p>`));
    if (!hist().length) return view.append(el(`<div class="empty">Log a workout to see progress.</div>`));

    const end = new Date(); end.setHours(0, 0, 0, 0);
    let start;
    if (RANGES[range]) { start = new Date(end); start.setDate(start.getDate() - RANGES[range]); }
    else start = parse(hist()[0].date);
    const colors = ['#2563eb', '#16a34a', '#d97706', '#9333ea', '#dc2626', '#0891b2', '#be185d', '#65a30d'];

    const names = pid() === 'strength' ? [...ALL_LIFTS] : [];
    hist().forEach(w => w.lifts.forEach(l => { if (!names.includes(l.name)) names.push(l.name); }));
    names.forEach((name, i) => {
      const all = [];
      hist().forEach(w => { const l = w.lifts.find(x => x.name === name); if (l) all.push({ date:w.date, t:parse(w.date), kg:l.weight }); });
      const pts = all.filter(p => p.t >= start && p.t <= end);
      if (!all.length) return;
      const latest = all[all.length - 1];
      const body = pts.length
        ? chart(pts, colors[i % colors.length], start, end)
        : `<div class="empty" style="padding:10px 0">No sessions in this period</div>`;
      const change = pts.length > 1 ? pts[pts.length - 1].kg - pts[0].kg : null;
      view.append(el(`<div class="card"><div class="row"><div class="grow"><h2>${esc(name)}</h2>
        <div class="sub">${pts.length} session${pts.length === 1 ? '' : 's'}${change !== null ? ` · ${change >= 0 ? '+' : ''}${fmt(change)} kg` : ''}</div></div>
        <div style="text-align:right"><b>${fmt(latest.kg)} kg</b><div class="sub">best ${fmt(Math.max(...all.map(p => p.kg)))}</div></div></div>${body}</div>`));
    });
  }

  function chart(pts, color, start, end) {
    const W = 320, H = 90, L = 30, R = 8, T = 8, B = 16;
    const ys = pts.map(p => p.kg);
    let min = Math.min(...ys), max = Math.max(...ys);
    if (min === max) { min -= 2.5; max += 2.5; }
    const t0 = start.getTime(), span = Math.max(end.getTime() - t0, 86400000);
    const x = p => L + (p.t.getTime() - t0) / span * (W - L - R);
    const y = v => H - B - (v - min) / (max - min) * (H - B - T);
    const path = pts.map((p, i) => `${i ? 'L' : 'M'}${x(p).toFixed(1)},${y(p.kg).toFixed(1)}`).join(' ');
    const dots = pts.map(p => `<circle cx="${x(p).toFixed(1)}" cy="${y(p.kg).toFixed(1)}" r="3" fill="${color}"><title>${p.date}: ${fmt(p.kg)} kg</title></circle>`).join('');
    const d = t => t.toLocaleDateString(undefined, { day:'numeric', month:'short' });
    const txt = 'fill="currentColor" opacity=".55" font-size="9"';
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight over time">
      <line x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}" stroke="currentColor" opacity=".15"/>
      <text x="${L - 4}" y="${T + 3}" text-anchor="end" ${txt}>${fmt(max)}</text>
      <text x="${L - 4}" y="${H - B}" text-anchor="end" ${txt}>${fmt(min)}</text>
      <text x="${L}" y="${H - 3}" ${txt}>${d(start)}</text>
      <text x="${W - R}" y="${H - 3}" text-anchor="end" ${txt}>${d(end)}</text>
      <path d="${path}" fill="none" stroke="${color}" stroke-width="2"/>${dots}</svg>`;
  }

  function esc(t) { return String(t).replace(/[&<>"']/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch])); }

  function extrasCard() {
    const list = state.extras.map((e, i) => `<div class="xrow" data-i="${i}">
        <div class="grow"><b>${esc(e.name)}</b><div class="sub">${e.sets}×${e.reps} · ${e.bw ? 'bodyweight, start +' : 'start '}${fmt(e.start)} kg · +${fmt(e.inc)} kg/session</div></div>
        <label class="chk"><input type="checkbox" data-w="A" ${e.on.A ? 'checked' : ''}>A</label>
        <label class="chk"><input type="checkbox" data-w="B" ${e.on.B ? 'checked' : ''}>B</label>
        <button class="ghost danger" data-del>✕</button></div>`).join('');
    const c = el(`<div class="card setup"><h2>Extra exercises</h2>
      <p class="hint">Optional add-ons for each workout. Tick A and/or B to choose where they appear. Weights go up by the amount you set each session. Tick Bodyweight for moves like pull-ups: the weight is then <i>added</i> weight on top of your body (start at 0).</p>
      ${list || '<div class="sub" style="padding:4px 0 8px">None yet.</div>'}
      <div class="xadd">
        <input id="xn" type="text" placeholder="Exercise name (e.g. Pull-ups)" maxlength="40">
        <div class="xnums">
          <label>Sets<input id="xs" type="number" min="1" max="5" value="3"></label>
          <label>Reps<input id="xr" type="number" min="1" max="99" value="10"></label>
          <label>Start kg<input id="xw" type="number" min="0" step="0.5" value="0"></label>
          <label>+kg<input id="xi" type="number" min="0" step="0.5" value="2.5"></label>
        </div>
        <div class="row"><label class="chk"><input id="xa" type="checkbox" checked>Workout A</label>
          <label class="chk"><input id="xb" type="checkbox" checked>Workout B</label>
          <label class="chk"><input id="xbw" type="checkbox">Bodyweight</label>
          <span class="grow"></span><button class="ghost" id="xadd">Add</button></div>
      </div></div>`);
    c.querySelectorAll('.xrow').forEach(r => {
      const e = state.extras[Number(r.dataset.i)];
      r.querySelectorAll('input[data-w]').forEach(cb => cb.onchange = () => { e.on[cb.dataset.w] = cb.checked; state.draft = null; save(); });
      r.querySelector('[data-del]').onclick = () => {
        if (!confirm(`Remove ${e.name} from your workouts? Past logs are kept.`)) return;
        state.extras.splice(Number(r.dataset.i), 1); state.draft = null; save(); render();
      };
    });
    c.querySelector('#xadd').onclick = () => {
      const name = c.querySelector('#xn').value.trim();
      const num = (id, lo, hi, d) => Math.min(hi, Math.max(lo, Number(c.querySelector(id).value) || d));
      if (!name) return alert('Enter an exercise name.');
      const taken = [...ALL_LIFTS, ...state.extras.map(e => e.name)].some(n => n.toLowerCase() === name.toLowerCase());
      if (taken) return alert('That exercise already exists.');
      const on = { A:c.querySelector('#xa').checked, B:c.querySelector('#xb').checked };
      if (!on.A && !on.B) return alert('Pick workout A, B or both.');
      state.extras.push({ name, sets:num('#xs', 1, 5, 3), reps:num('#xr', 1, 99, 10), start:num('#xw', 0, 1000, 0), inc:num('#xi', 0, 100, 0), bw:c.querySelector('#xbw').checked, on });
      state.draft = null; save(); render();
    };
    return c;
  }

  function programCard() {
    const c = el(`<div class="card"><h2>Program</h2>
      <p class="hint">Switch between your strength program and the volume program. Each keeps its own history and weights. Your data is never deleted when you switch.</p>
      <div class="seg" style="margin:0">${Object.keys(PROGRAMS).map(k => `<button data-p="${k}" class="${k === pid() ? 'on' : ''}">${PROGRAMS[k].name}</button>`).join('')}</div></div>`);
    c.querySelectorAll('[data-p]').forEach(b => b.onclick = () => {
      if (b.dataset.p === pid()) return;
      if (state.draft && state.draft.lifts.some(l => l.reps.some(r => r !== null)) && !confirm('Switch program? Your unfinished workout will be discarded.')) return;
      state.program = b.dataset.p; state.draft = null; save(); render();
    });
    return c;
  }

  function volumeCard() {
    const days = Object.keys(state.volumeDays).sort();
    const c = el(`<div class="card setup"><h2>Volume plan</h2>
      <p class="hint">One exercise per line. A plain name uses the program's ${prog().sets}×${prog().reps}. Add <b>3x12</b> after a name for a different scheme (max 10 sets), and <b>bw</b> at the end for bodyweight moves, e.g. <i>Pull-ups 3x10 bw</i>. Shared by both volume programs. Weight goes up ${DEFAULT_INC} kg only once every set hits its target reps.</p>
      ${days.map(d => `<div class="vd"><div class="sub">Workout ${d}</div><textarea rows="${Math.max(3, state.volumeDays[d].length + 1)}" data-d="${d}" spellcheck="false">${esc(state.volumeDays[d].join('\n'))}</textarea></div>`).join('')}
      <button class="ghost" id="vsave">Save plan</button></div>`);
    c.querySelector('#vsave').onclick = () => {
      c.querySelectorAll('textarea').forEach(t => { state.volumeDays[t.dataset.d] = t.value.split('\n').map(x => x.trim()).filter(Boolean); });
      state.draft = null; save(); alert('Saved'); render();
    };
    return c;
  }

  function renderSettings() {
    view.append(programCard());
    view.append(pid() === 'strength' ? extrasCard() : volumeCard());
    const c = el(`<div class="card"><h2>Data</h2>
      <p class="hint">Your data is stored in this browser only. Export a backup now and then.</p>
      <div class="row" style="flex-wrap:wrap">
        <button class="ghost" id="exp">Export backup</button>
        <button class="ghost" id="imp">Import backup</button>
        <input type="file" id="file" accept="application/json" hidden>
      </div></div>`);
    c.querySelector('#exp').onclick = () => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(state, null, 2)], { type:'application/json' }));
      a.download = `tracker-backup-${iso(new Date())}.json`; a.click();
    };
    const file = c.querySelector('#file');
    c.querySelector('#imp').onclick = () => file.click();
    file.onchange = async () => {
      try {
        const s = JSON.parse(await file.files[0].text());
        if (!s.history || !s.start) throw new Error('Not a tracker backup');
        if (!confirm('Replace current data with this backup?')) return;
        state = normalize(s); save(); render();
      } catch (e) { alert('Import failed: ' + e.message); }
    };
    view.append(c);

    const s = el(`<div class="card setup"><h2>Starting weights</h2>
      <p class="hint">Only used for a lift that has no history yet.</p>
      ${ALL_LIFTS.map(l => `<label>${l}<span><input type="number" step="2.5" min="0" data-l="${l}" value="${state.start[l]}"> kg</span></label>`).join('')}
      <button class="ghost" id="sv" style="margin-top:8px">Save</button></div>`);
    s.querySelector('#sv').onclick = () => {
      s.querySelectorAll('input').forEach(i => { state.start[i.dataset.l] = Number(i.value) || 0; });
      state.draft = null; save(); alert('Saved'); render();
    };
    view.append(s);
  }

  document.querySelectorAll('nav button').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
  render();

  // Offline support (needs https:// or localhost; silently skipped on file://)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
})();
</script>
</body>
</html>
